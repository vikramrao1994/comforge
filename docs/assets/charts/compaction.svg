<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-labelledby="t s"><title id="t">Compact output for the same content</title><desc id="s">Tokens before and after the compact flags (equivalent content). Lower is smaller. MCP discovery, 17 tools: tools/list 11,019, --compact-discovery 6,759; MCP discovery, 10 tools: tools/list 6,110, --compact-discovery 3,332; CLI, one initiative's full record: --json 1,543, --json --compact 1,230; CLI, every initiative's status: --json 3,701, --json --compact 3,120.</desc>

<text x="672" y="97" class="value">2,587</text>
<text x="198" y="121" class="label" text-anchor="end">CLI --json</text>
<rect x="206" y="108" width="288" height="18" rx="3" class="comforge"><title>List pull requests — CLI --json: 1,617 tokens</title></rect>
<text x="500" y="121" class="value">1,617</text>
<text x="198" y="145" class="label" text-anchor="end">MCP tool result</text>

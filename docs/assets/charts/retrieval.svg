<text x="198" y="201" class="label" text-anchor="end">raw GitHub REST JSON</text>
<rect x="206" y="188" width="254" height="18" rx="3" class="baseline"><title>An issue's comments — raw GitHub REST JSON: 1,431 tokens</title></rect>
<text x="466" y="201" class="value">1,431</text>
<text x="198" y="225" class="label" text-anchor="end">CLI --json</text>
<rect x="206" y="212" width="225" height="18" rx="3" class="comforge"><title>An issue's comments — CLI --json: 1,264 tokens</title></rect>
<text x="437" y="225" class="value">1,264</text>
<text x="198" y="249" class="label" text-anchor="end">MCP tool result</text>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="371" viewBox="0 0 760 371" role="img" aria-labelledby="t s"><title id="t">Selective retrieval vs raw GitHub JSON</title><desc id="s">Tokens an agent reads for the same information (equivalent content). Lower is smaller. List pull requests: raw GitHub REST JSON 2,587, CLI --json 1,617, MCP tool result 1,191; An issue's comments: raw GitHub REST JSON 1,431, CLI --json 1,264, MCP tool result 969.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.title{fill:#0f1720;font:600 16px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.sub,.note{fill:#4b5563;font:12px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.group{fill:#0f1720;font:600 13px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.label{fill:#0f1720;font:12px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.value{fill:#0f1720;font:600 12px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.baseline{fill:#8c959f}.comforge{fill:#0b7285}.larger{fill:#b45309}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117;stroke:#30363d}.title,.group,.label,.value{fill:#e6edf3}.sub,.note{fill:#9aa4b2}.baseline{fill:#6e7681}.comforge{fill:#3bc9db}.larger{fill:#f59e0b}}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="370" rx="8"/>
<text x="24" y="30" class="title">Selective retrieval vs raw GitHub JSON</text>
<text x="24" y="50" class="sub">Tokens an agent reads for the same information (equivalent content). Lower is smaller.</text>

<text x="24" y="312" class="note">Selective retrieval: the same fields, without the REST envelope. Not reproducible credential-free (needs live GitHub).</text>
<text x="24" y="329" class="note">Historical: release candidates before the current releases; Anthropic token counts per text.</text>
<text x="24" y="346" class="note">Component-level only — not an end-to-end agent saving. Method and limits: docs/benchmarks/README.md</text>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="566" viewBox="0 0 820 566" role="img" aria-labelledby="t d"><title id="t">Parallel agent development — Comforge terminal demo</title><desc id="d">Two agents work on two tickets at once, each in its own checkout, with no shared working tree. Text transcript: docs/demos/parallel-agents.md</desc>
<rect width="820" height="566" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="16" r="5" fill="#484f58"/><circle cx="36" cy="16" r="5" fill="#484f58"/><circle cx="52" cy="16" r="5" fill="#484f58"/>
<text x="410" y="20" fill="#9aa4b2" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Parallel agent development · synthetic GitHub</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<text x="16" y="44" fill="#9aa4b2" xml:space="preserve"># Two published specifications; one checkout per agent</text>
<text x="16" y="62" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge start ACME-201 --issue 100 --json --summary | grep -E '^  "(branch|initiative)"'</text>
<text x="16" y="80" fill="#e6edf3" xml:space="preserve">  "branch": "agent/acme-201",</text>
<text x="16" y="98" fill="#e6edf3" xml:space="preserve">  "initiative": "ACME-201",</text>
<text x="16" y="116" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge start ACME-202 --issue 101 --json --summary | grep -E '^  "(branch|initiative)"'</text>
<text x="16" y="134" fill="#e6edf3" xml:space="preserve">  "branch": "agent/acme-202",</text>
<text x="16" y="152" fill="#e6edf3" xml:space="preserve">  "initiative": "ACME-202",</text>
<text x="16" y="170" fill="#9aa4b2" xml:space="preserve"># Each agent commits in its own checkout</text>
<text x="16" y="188" fill="#3bc9db" font-weight="600" xml:space="preserve">$ git -C ../widgets-agents/acme-201 commit -q --allow-empty -m $'feat: parser\n\nTicket: ACME-201'</text>
<text x="16" y="206" fill="#3bc9db" font-weight="600" xml:space="preserve">$ git -C ../widgets-agents/acme-202 commit -q --allow-empty -m $'feat: formatter\n\nTicket: ACME-202</text>
<text x="16" y="224" fill="#3bc9db" font-weight="600" xml:space="preserve">  '</text>
<text x="16" y="242" fill="#9aa4b2" xml:space="preserve"># Validation and state are per initiative</text>
<text x="16" y="260" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge verify ACME-201 --json --summary | grep -E '^  "(initiative|status)"'</text>
<text x="16" y="278" fill="#e6edf3" xml:space="preserve">  "initiative": "ACME-201",</text>
<text x="16" y="296" fill="#e6edf3" xml:space="preserve">  "status": "PASS",</text>
<text x="16" y="314" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge verify ACME-202 --json --summary | grep -E '^  "(initiative|status)"'</text>
<text x="16" y="332" fill="#e6edf3" xml:space="preserve">  "initiative": "ACME-202",</text>
<text x="16" y="350" fill="#e6edf3" xml:space="preserve">  "status": "PASS",</text>
<text x="16" y="368" fill="#9aa4b2" xml:space="preserve"># Deliver both: two pull requests, two completion records</text>
<text x="16" y="386" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge deliver ACME-201 --title "Parser" --result a.json --execute --json --summary | grep '"del</text>
<text x="16" y="404" fill="#3bc9db" font-weight="600" xml:space="preserve">  ivery"'</text>
<text x="16" y="422" fill="#e6edf3" xml:space="preserve">  "delivery": "complete",</text>
<text x="16" y="440" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge deliver ACME-202 --title "Formatter" --result b.json --execute --json --summary | grep '"</text>
<text x="16" y="458" fill="#3bc9db" font-weight="600" xml:space="preserve">  delivery"'</text>
<text x="16" y="476" fill="#e6edf3" xml:space="preserve">  "delivery": "complete",</text>
<text x="16" y="494" fill="#3bc9db" font-weight="600" xml:space="preserve">$ comforge prs --json | jq -r '.pullRequests[] | "#\(.number)  \(.headRef)  \(.title.text)"'</text>
<text x="16" y="512" fill="#e6edf3" xml:space="preserve">#102  agent/acme-201  Parser</text>
<text x="16" y="530" fill="#e6edf3" xml:space="preserve">#104  agent/acme-202  Formatter</text>
</g>
</svg>

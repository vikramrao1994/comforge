# npm distribution of a Comforge @comforge/ledger release, run from the release commit itself.
#
# A `ledger/vX.Y.Z` tag pushed by the release publisher starts it. Same design as the core
# workflow (npm-publish.yml on releases/core), with its own identity: this file name and the
# `npm-ledger` environment are what @comforge/ledger's npm Trusted Publisher trusts, so this
# workflow can never publish another Comforge package and theirs can never publish this one. The
# plan job refuses a version that is not new, a release that is not @comforge/ledger's, and a
# package that does not exist on npm yet (Trusted Publishing cannot attach to it; the owner
# bootstraps the first version). It publishes directly: the owner's gate is the approval of the
# release run that pushed the tag (release.yml, environment comforge-release).
name: npm-publish-ledger

on:
  push:
    tags: ["ledger/v*"]

permissions: {}

concurrency:
  group: npm-publish-ledger
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # GitHub's tag filter is a glob; this is the exact, case-sensitive check.
      - name: Require a ledger/vX.Y.Z tag
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::not a tag push"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/ledger/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF is not ledger/vX.Y.Z"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch the release branch
        run: git fetch --no-tags --quiet origin +refs/heads/releases/ledger:refs/remotes/origin/releases/ledger
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.16.0
      - name: Plan and verify the npm tarball
        run: |
          node .github/comforge/npm-release.mjs plan \
            --release-dir . \
            --commit "$GITHUB_SHA" \
            --tag "${GITHUB_REF#refs/tags/}" \
            --repository "$GITHUB_REPOSITORY" \
            --release-branch-ref refs/remotes/origin/releases/ledger \
            --package @comforge/ledger \
            --out "$RUNNER_TEMP/npm-release"
      - name: Refuse a package npm cannot publish through Trusted Publishing yet
        run: |
          node -e '
            const p = require(process.env.RUNNER_TEMP + "/npm-release/npm-plan.json");
            if (p.package !== "@comforge/ledger") { console.error("::error::plan is for " + p.package); process.exit(1); }
            if (p.registry.bootstrapRequired) { console.error("::error::@comforge/ledger does not exist on npm; the owner bootstraps the first version, then configures its Trusted Publisher"); process.exit(1); }'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-ledger
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a ledger/vX.Y.Z tag
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::not a tag push"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/ledger/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF is not ledger/vX.Y.Z"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.16.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Require the OIDC credential
        run: |
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::no OIDC token endpoint: id-token: write is missing"; exit 1; }
      - name: Re-verify the planned tarball and publish it
        run: |
          plan="$RUNNER_TEMP/npm-release/npm-plan.json"
          tarball="$RUNNER_TEMP/npm-release/$(node -p "require('$plan').tarball.file")"
          node .github/comforge/npm-release.mjs verify-tarball --plan "$plan" --tarball "$tarball"
          npm publish "$tarball" --access public --provenance --ignore-scripts
      - name: Next steps
        run: |
          version="${GITHUB_REF#refs/tags/ledger/v}"
          {
            echo "### @comforge/ledger@$version published"
            echo "Next, in the Comforge repository: \`bun run release:npm-readback --package @comforge/ledger --commit $GITHUB_SHA\`, then \`bun run release:record\`."
          } >> "$GITHUB_STEP_SUMMARY"

# npm distribution of a Comforge core release, run from the release commit itself.
#
# A `core/vX.Y.Z` tag pushed by the release publisher starts it. The first job plans and
# verifies the npm tarball with read-only permissions: the tag must name a commit on
# releases/core whose RELEASE.json, files, licence and changelog agree, and the version must be
# new on the registry. The second job runs in the `npm` environment, receives the short-lived
# npm credential through OIDC (Trusted Publishing:
# this repository, this workflow file, environment `npm`), re-verifies the planned bytes and
# publishes them directly: the owner's gate is the approval of the release run that pushed
# the tag (release.yml, environment comforge-release). npm attaches provenance that names this repository, this workflow,
# the tag and the release commit; the owner checks it with `release:npm-readback
# --commit <release commit>`.
#
# There is no token fallback: without a matching Trusted Publisher on npm the publish step
# fails. The first version of a package cannot be published here: npm can attach a Trusted
# Publisher only to a package that already exists.
name: npm-publish

on:
  push:
    tags: ["core/v*"]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # GitHub's tag filter is a glob; this is the exact, case-sensitive check.
      - name: Require a core/vX.Y.Z tag
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::not a tag push"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/core/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF is not core/vX.Y.Z"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch the release branch
        run: git fetch --no-tags --quiet origin +refs/heads/releases/core:refs/remotes/origin/releases/core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.16.0
      - name: Plan and verify the npm tarball
        run: |
          node .github/comforge/npm-release.mjs plan \
            --release-dir . \
            --commit "$GITHUB_SHA" \
            --tag "${GITHUB_REF#refs/tags/}" \
            --repository "$GITHUB_REPOSITORY" \
            --release-branch-ref refs/remotes/origin/releases/core \
            --out "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a core/vX.Y.Z tag
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::not a tag push"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/core/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF is not core/vX.Y.Z"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.16.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Require the OIDC credential
        run: |
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::no OIDC token endpoint: id-token: write is missing"; exit 1; }
      - name: Re-verify the planned tarball and publish it
        run: |
          plan="$RUNNER_TEMP/npm-release/npm-plan.json"
          tarball="$RUNNER_TEMP/npm-release/$(node -p "require('$plan').tarball.file")"
          node .github/comforge/npm-release.mjs verify-tarball --plan "$plan" --tarball "$tarball"
          npm publish "$tarball" --access public --provenance --ignore-scripts
      - name: Next steps
        run: |
          version="${GITHUB_REF#refs/tags/core/v}"
          {
            echo "### @comforge/core@$version published"
            echo "Next, in the Comforge repository: \`bun run release:npm-readback --package @comforge/core --commit $GITHUB_SHA\`, then \`bun run release:record\`."
          } >> "$GITHUB_STEP_SUMMARY"

name: Release a Comforge package

# Builds the release candidate of one Comforge package (`package`: core, github, ledger, cli,
# mcp; registry: tooling/release/packages.ts) from this repository's main and, only when the
# owner explicitly authorized exactly that candidate, pushes a new immutable version to that
# package's own release branch and tag in this repository (releases/<id> + <id>/vX.Y.Z). It
# never writes main. The tag push starts the package's npm workflow (npm-publish.yml for core,
# npm-publish-<id>.yml for each other package), which npm Trusted Publishing trusts.
# Governance, owner gates and recovery: docs/release-governance.md.
#
# Single publisher. Until the owner moves publication here, releases are still published by
# the previous publisher, and this workflow only rehearses: jobs `authorize` and `release`
# run only when the repository variable COMFORGE_PUBLISHER is exactly "comforge".
#
# Manual only. Job `candidate` holds no credential: it builds twice, checks reproducibility,
# the disclosure scan and the Node import, runs the release planner, proves CI for the commit,
# rehearses the sync in a throwaway copy of the release branches and shows the immutable
# candidate (digest, version, source commit, risk) in the run summary. A publish run needs the
# owner's signed release authorization for exactly that candidate, created and dispatched by
# `bun run release:approve`: job `authorize`, still without a credential, verifies it against
# release-trust.json and this workflow at the source commit and refuses an expired, revoked,
# replayed or mismatched one; job `release` verifies it again, mints the credential, rebuilds,
# and publishes only if the rebuild matches the authorized candidate. Nothing is typed by hand.
#
# Who can still publish: anyone who can change this workflow or the trust file on main. Keep
# workflow and trust changes owner-reviewed (CODEOWNERS, required review on main).
run-name: ${{ inputs.publish && format('Comforge release {0}', inputs.authorization_id) || format('Comforge {0} candidate', inputs.package) }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release (set by release:approve)"
        type: choice
        options: [core, github, ledger, cli, mcp]
        default: core
      publish:
        description: "Publish (set by release:approve; unticked = dry run that builds a candidate)"
        type: boolean
        default: false
      authorization:
        description: "Owner-signed release authorization (set by release:approve; never typed)"
        type: string
        default: ""
      authorization_id:
        description: "Its id (set by release:approve)"
        type: string
        default: ""
      approve_workflows:
        description: "Mirror workflow change, as signed in the authorization (set by release:approve)"
        type: string
        default: ""

permissions:
  contents: read

# One publisher at a time; a queued run waits instead of racing the push.
concurrency:
  group: comforge-release
  cancel-in-progress: false

env:
  MIRROR_REPOSITORY: ${{ github.repository }}
  PUBLISH: ${{ inputs.publish == true }}
  PACKAGE: ${{ inputs.package }}

jobs:
  candidate:
    name: Build the release candidate
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      source: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The publisher verifies the source commit is on origin/main; the planner reads history.
          fetch-depth: 0
      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Every package, whichever is released: @comforge/github's suite is the compatibility
      # check for any @comforge/core change.
      - name: Test the packages and the publisher
        run: bun run release:candidates && bun test --isolate packages/core/test packages/github/test packages/ledger/test packages/cli/test packages/mcp/test tests/release tests/github tests/ledger tests/cli tests/mcp
      # The repository is public: the candidate job reads it anonymously, through git and not
      # the rate-limited REST API (see the script). Without the repository, the dry run plans a
      # first release into an empty local repository.
      - name: Prepare repository checkout (anonymous)
        run: tooling/release/prepareMirrorCheckout.sh "https://github.com/$MIRROR_REPOSITORY.git" mirror-repo
      - name: Build, plan and show the candidate
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:build --package "$PACKAGE" --dest mirror-repo --out generated/factory-core-release --ci-proof
      - name: Refuse to publish a candidate that is not release-ready
        if: env.PUBLISH == 'true'
        run: |
          bun -e '
            const fs = require("fs");
            const file = "generated/factory-core-release/candidate.json";
            if (!fs.existsSync(file)) {
              console.error("::error::no candidate was built: the release plan is not release-ready; nothing to publish");
              process.exit(1);
            }
            const c = JSON.parse(fs.readFileSync(file, "utf8"));
            if (c.plan.status !== "release-ready" || !c.ci?.ok) {
              console.error(`::error::candidate ${c.digest} is ${c.plan.status}, CI ${c.ci?.ok ? "green" : "not proven"}; nothing to publish`);
              process.exit(1);
            }'
      - name: Upload candidate, plan, patch and tarball for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comforge-candidate
          path: |
            generated/factory-core-release/candidate.json
            generated/factory-core-release/plan.json
            generated/factory-core-release/release.patch
            generated/factory-core-release/a/
          retention-days: 30
          if-no-files-found: ignore

  authorize:
    name: Verify the owner's authorization (no credential)
    needs: candidate
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      vars.COMFORGE_PUBLISHER == 'comforge' &&
      inputs.publish == true
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout the candidate's source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.source }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comforge-candidate
          path: approved
      # Signature, trusted key and its GitHub login, dispatcher, window, revocation, every
      # binding to the candidate, this workflow's digest, run attempt 1, and no other run
      # that carried the same authorization (tooling/release/releaseAuthorization.ts).
      - name: Verify the authorization
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          APPROVE_WORKFLOWS: ${{ inputs.approve_workflows }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tooling/release/releaseAuthorization.ts verify --candidate approved/candidate.json --out approved/authorization.json

  release:
    name: Release the authorized candidate
    needs: [candidate, authorize]
    runs-on: ubuntu-latest
    # Mints the publishing credential: only from `main`, only by the repository owner, only
    # for a publish dispatch whose owner authorization job `authorize` verified, and only once
    # this repository is the active publisher (vars.COMFORGE_PUBLISHER). The environment
    # is restricted to main and holds the credential as an environment secret, so no other
    # branch's workflow can read it; it has no required reviewer (not on this plan).
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      vars.COMFORGE_PUBLISHER == 'comforge' &&
      inputs.publish == true
    environment: comforge-release
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # GitHub expressions compare strings case-insensitively; this exact check runs
      # before any step that receives a secret (tests/release/workflowPolicy.test.ts).
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout the candidate's source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.source }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the approved candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comforge-candidate
          path: approved
      # Again here, immediately before the credential exists in this job.
      - name: Verify the authorization
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          APPROVE_WORKFLOWS: ${{ inputs.approve_workflows }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tooling/release/releaseAuthorization.ts verify --candidate approved/candidate.json --out approved/authorization.json

      # GitHub App (preferred: short-lived installation token for this repository) when
      # COMFORGE_APP_ID is configured; otherwise the fine-grained PAT.
      - name: Create GitHub App token
        id: app-token
        if: vars.COMFORGE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.COMFORGE_APP_ID }}
          private-key: ${{ secrets.COMFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The write credential exists only in this step and, through the checkout, the release step.
      - name: Prepare repository checkout
        id: destination
        env:
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token || secrets.COMFORGE_RELEASE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Publishing needs a credential for $MIRROR_REPOSITORY in environment comforge-release (vars.COMFORGE_APP_ID + secrets.COMFORGE_APP_PRIVATE_KEY, or secrets.COMFORGE_RELEASE_TOKEN)."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PUBLISH_TOKEN" "https://api.github.com/repos/$MIRROR_REPOSITORY")
          if [ "$status" != "200" ]; then
            echo "::error::$MIRROR_REPOSITORY returned HTTP $status for this credential. This workflow never creates repositories."
            exit 1
          fi
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" clone -q "https://github.com/$MIRROR_REPOSITORY.git" mirror-repo
          git -C mirror-repo config "http.https://github.com/.extraheader" "$header"

      - name: Rebuild, match the authorized candidate and release
        id: release
        env:
          APPROVE_WORKFLOWS: ${{ inputs.approve_workflows }}
        run: bun run release:build --package "$PACKAGE" --dest mirror-repo --out generated/factory-core-release --publish --candidate approved/candidate.json --authorization approved/authorization.json --approve-workflows "$APPROVE_WORKFLOWS"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Comforge $PACKAGE release"
            echo "- Mirror: \`$MIRROR_REPOSITORY\`"
            echo "- Version: ${{ steps.release.outputs.version }}"
            echo "- Changed: ${{ steps.release.outputs.changed }}"
            echo "- Next: the tag push starts the package's npm workflow in the Comforge repository (npm-publish.yml for core, npm-publish-<id>.yml for each other package); approve its environment, then the staged version (npm stage approve), then update consumers to the read-back version."
          } >> "$GITHUB_STEP_SUMMARY"

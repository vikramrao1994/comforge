name: Release a Comforge package

# Releases every Comforge package (core, github, ledger, cli, mcp; registry:
# tooling/release/packages.ts) that the release planner reports release-ready on main. It starts
# when CI finishes green for a push to main (a merged version PR) and builds exactly that commit;
# a manual dispatch releases one package from main's head. For each package it pushes
# a new immutable version to that package's own release branch and tag in this repository
# (releases/<id> + <id>/vX.Y.Z), never main. The tag push starts the package's npm workflow
# (npm-publish.yml for core, npm-publish-<id>.yml for each other package), which publishes
# directly through npm Trusted Publishing with provenance.
# Governance, the owner's gate and recovery: docs/contributing/release-governance.md.
#
# Single publisher: jobs that can publish run only when the repository variable
# COMFORGE_PUBLISHER is exactly "comforge", and job `release` refuses before any credential
# exists unless the comforge-release environment records the date the previous publisher was
# retired (COMFORGE_PREVIOUS_PUBLISHER_RETIRED; docs/contributing/release-transition.md).
#
# The owner's gate is one approval. Jobs `select` and `candidate` hold no credential: the
# candidate is built twice, checked for reproducibility, disclosure and the Node import,
# planned, proven green in CI for its commit, rehearsed in a throwaway copy of the release
# branches and shown in the run summary (digest, version, source commit, workflow change). Job
# `release` waits in the comforge-release environment, whose required reviewer is the owner;
# after the approval it reads that approval of this run back from GitHub
# (tooling/release/environmentApproval.ts), mints the credential, rebuilds, and publishes only a
# rebuild byte-identical to the candidate this run built. Nothing is typed, signed or copied.
#
# Who can publish: whoever can approve the comforge-release environment and merge to main. Keep
# the environment's required reviewer, this workflow and the release tooling owner-reviewed.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Comforge {0} release', inputs.package) || format('Comforge release ({0})', github.event.workflow_run.head_sha) }}
on:
  # Only after CI proved the commit: the candidate's CI proof needs its checks green.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release (it must be release-ready on main)"
        type: choice
        options: [core, github, ledger, cli, mcp]
        default: core

permissions:
  contents: read

# One publisher at a time; a queued run waits instead of racing the push.
concurrency:
  group: comforge-release
  cancel-in-progress: false

env:
  MIRROR_REPOSITORY: ${{ github.repository }}
  # The commit CI proved (workflow_run), or main's head (dispatch).
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  select:
    name: Select the release-ready packages
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout the commit CI proved
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # In dependency order (the registry's); --registry: a version already on npm is never
      # selected again, whether or not its release record is committed yet.
      - name: Ask the planner
        id: select
        env:
          REQUESTED: ${{ inputs.package }}
        run: bun tooling/release/releaseSelect.ts --registry ${REQUESTED:+--package "$REQUESTED"} >> "$GITHUB_OUTPUT"

  candidate:
    name: Build the release candidate
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.packages != '[]'
    strategy:
      fail-fast: false
      # Dependency order: a dependent's candidate follows its sibling.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout the commit CI proved
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          # The publisher verifies the source commit is on origin/main; the planner reads history.
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # The release tests read the published harness (tests/release/npmRelease.test.ts), as in CI.
      - name: Install dependencies
        run: bun install --frozen-lockfile && bun run harness:install
      # Every package, whichever is released: @comforge/github's suite is the compatibility
      # check for any @comforge/core change. Bun ignores bunfig's test timeout, hence the flag.
      - name: Test the packages and the publisher
        run: bun run release:candidates && bun test --isolate --timeout 30000 packages/core/test packages/github/test packages/ledger/test packages/cli/test packages/mcp/test tests/release tests/github tests/ledger tests/cli tests/mcp
      # The repository is public: the candidate job reads it anonymously, through git and not
      # the rate-limited REST API (see the script). Without the repository, the dry run plans a
      # first release into an empty local repository.
      - name: Prepare repository checkout (anonymous)
        run: tooling/release/prepareMirrorCheckout.sh "https://github.com/$MIRROR_REPOSITORY.git" mirror-repo
      - name: Build, plan and show the candidate
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:build --package "$PACKAGE" --dest mirror-repo --out generated/factory-core-release --ci-proof
      - name: Refuse to publish a candidate that is not release-ready
        run: |
          bun -e '
            const fs = require("fs");
            const file = "generated/factory-core-release/candidate.json";
            if (!fs.existsSync(file)) {
              console.error("::error::no candidate was built: the release plan is not release-ready; nothing to publish");
              process.exit(1);
            }
            const c = JSON.parse(fs.readFileSync(file, "utf8"));
            if (c.plan.status !== "release-ready" || !c.ci?.ok) {
              console.error(`::error::candidate ${c.digest} is ${c.plan.status}, CI ${c.ci?.ok ? "green" : "not proven"}; nothing to publish`);
              process.exit(1);
            }'
      - name: Upload candidate, plan, patch and tarball for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comforge-candidate-${{ matrix.package }}
          path: |
            generated/factory-core-release/candidate.json
            generated/factory-core-release/plan.json
            generated/factory-core-release/release.patch
            generated/factory-core-release/a/
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Release the approved candidate
    needs: [select, candidate]
    runs-on: ubuntu-latest
    # Mints the publishing credential: only from main, only for a run the owner started, only
    # once this repository is the active publisher, and only after the owner approved this
    # run's comforge-release environment. The environment is restricted to main and holds the
    # credential as an environment secret, so no other branch's workflow can read it.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      vars.COMFORGE_PUBLISHER == 'comforge' &&
      needs.select.outputs.packages != '[]'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    environment: comforge-release
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      # GitHub expressions compare strings case-insensitively; this exact check runs
      # before any step that receives a secret (tests/release/workflowPolicy.test.ts).
      - name: Verify exact branch ref (case-sensitive)
        run: test "$GITHUB_REF" = "refs/heads/main"
      # Fail closed on the publisher transition (docs/contributing/release-transition.md).
      - name: Verify the previous publisher is retired
        env:
          RETIRED: ${{ vars.COMFORGE_PREVIOUS_PUBLISHER_RETIRED }}
        run: |
          if ! [[ "$RETIRED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::COMFORGE_PREVIOUS_PUBLISHER_RETIRED is not set to a date in environment comforge-release. Retire the previous publisher first (docs/contributing/release-transition.md); nothing was published."
            exit 1
          fi
          if [[ "$RETIRED" > "$(date -u +%F)" ]]; then
            echo "::error::COMFORGE_PREVIOUS_PUBLISHER_RETIRED ($RETIRED) is in the future; nothing was published."
            exit 1
          fi
      - name: Download this run's candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comforge-candidate-${{ matrix.package }}
          path: approved
      - name: Read the candidate's source commit
        id: source
        run: |
          sha=$(node -p "require('./approved/candidate.json').sourceCommit")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the candidate names no source commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout the candidate's source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          path: source
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      # The owner's approval of exactly this run, read back from GitHub before any credential.
      - name: Verify the owner's approval of this run
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tooling/release/environmentApproval.ts verify

      # GitHub App (preferred: short-lived installation token for this repository) when
      # COMFORGE_APP_ID is configured; otherwise the fine-grained PAT.
      - name: Create GitHub App token
        id: app-token
        if: vars.COMFORGE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.COMFORGE_APP_ID }}
          private-key: ${{ secrets.COMFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The write credential exists only in this step and, through the checkout, the release step.
      - name: Prepare repository checkout
        working-directory: source
        env:
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token || secrets.COMFORGE_RELEASE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Publishing needs a credential for $MIRROR_REPOSITORY in environment comforge-release (vars.COMFORGE_APP_ID + secrets.COMFORGE_APP_PRIVATE_KEY, or secrets.COMFORGE_RELEASE_TOKEN)."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PUBLISH_TOKEN" "https://api.github.com/repos/$MIRROR_REPOSITORY")
          if [ "$status" != "200" ]; then
            echo "::error::$MIRROR_REPOSITORY returned HTTP $status for this credential. This workflow never creates repositories."
            exit 1
          fi
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" clone -q "https://github.com/$MIRROR_REPOSITORY.git" mirror-repo
          git -C mirror-repo config "http.https://github.com/.extraheader" "$header"

      - name: Rebuild, match the approved candidate and release
        id: release
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:build --package "$PACKAGE" --dest mirror-repo --out generated/factory-core-release --publish --candidate ../approved/candidate.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### Comforge $PACKAGE release"
            echo "- Mirror: \`$MIRROR_REPOSITORY\`"
            echo "- Version: ${{ steps.release.outputs.version }}"
            echo "- Changed: ${{ steps.release.outputs.changed }}"
            echo "- Next: the tag push starts the package's npm workflow (npm-publish.yml for core, npm-publish-<id>.yml for each other package), which publishes directly; then bun run release:npm-readback and bun run release:record."
          } >> "$GITHUB_STEP_SUMMARY"
